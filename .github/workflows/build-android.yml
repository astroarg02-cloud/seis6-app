name: Generar APK de Android (Vite + Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android desde Vite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22 y Java JDK 21
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Compilar aplicación web e integrar en Capacitor (100% Nativo sin URLs externas)
        run: |
          npm install --legacy-peer-deps
          npm run build
          mkdir -p cap-app
          cp -r dist cap-app/dist
          cd cap-app
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cp ../capacitor.config.json capacitor.config.json
          if [ ! -d "android" ]; then
            if [ -d "../android" ]; then
              echo "Preserving master android directory with custom SEIS 6 icons..."
              cp -r ../android android
            else
              npx cap add android
            fi
          fi
          npx cap sync android

      - name: 4. Aplicar configuración AMOLED #000000 y correcciones Gradle
        run: |
          node scripts/configure-android.cjs

      - name: 5. Aceptar licencias de Android SDK sin bloqueos
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK detectado en: $ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne679f4ae0925e0c598285ab3fbe3f6050b1d84a7\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n799480906511405d0413d57b7e73d97f766d0f38\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "601085b94cd77f6b54b86e0463cc038448940544\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          printf "33b6aa53a34e79ad150074555804441198f216e0\n" > "$ANDROID_HOME/licenses/google-gdk-license"
          printf "e9acab583f1529a49c12474666d3c3957e243ce3\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          echo "✓ Licencias Android SDK aprobadas exitosamente."

      - name: 6. Compilar APK Nativa con Gradle
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "cap-app/android" ]; then
            cd cap-app/android
          elif [ -d "android" ]; then
            cd android
          else
            echo "ERROR: Directorio android no encontrado."
            exit 1
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 7. Preparar archivo APK final
        run: |
          mkdir -p build-output
          APK_FOUND=$(find cap-app/android/app/build/outputs/apk android/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find . -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FOUND" ]; then
            echo "ERROR: No se encontró ningún archivo APK generado por Gradle."
            exit 1
          fi
          echo "APK encontrada en: $APK_FOUND"
          cp "$APK_FOUND" build-output/Seis6_App_v1.0.apk
          cp "$APK_FOUND" build-output/Seis6_Vault_v1.0.apk
          echo "Archivos preparados en build-output/:"
          ls -lh build-output/

      - name: 8. Subir APK lista para instalar en cualquier Android
        uses: actions/upload-artifact@v4
        with:
          name: Seis6-App-APK
          path: |
            build-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 9. Resumen de compilación
        run: |
          echo "### 🎉 ¡APK Compilada con Éxito desde Vite!" >> $GITHUB_STEP_SUMMARY
          echo "- **Motor:** Vite + React + Capacitor Nativo" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js:** v22" >> $GITHUB_STEP_SUMMARY
          echo "- **Java:** JDK 21" >> $GITHUB_STEP_SUMMARY
          echo "- **Android:** Compile/Target Android 16/15 (API 36 / API 35), Min SDK 24" >> $GITHUB_STEP_SUMMARY
          echo "- **Diseño:** 100% AMOLED Dark (#000000) Edge-to-Edge" >> $GITHUB_STEP_SUMMARY
          echo "- **Archivos:** \`Seis6_App_v1.0.apk\` y \`Seis6_Vault_v1.0.apk\` disponibles para descarga en Artifacts." >> $GITHUB_STEP_SUMMARY
